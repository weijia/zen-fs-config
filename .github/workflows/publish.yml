name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing：npm >= 11.5 会自动向 npmjs.org 交换
      # GitHub Actions 的 OIDC token，无需 NPM_TOKEN secret。
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 自带 npm 11；保险起见仍升级到最新版
      # （trusted publishing 要求 npm >= 11.5.0）。
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 不能用 `npm view` 判重：npm 12 对不存在的版本也会以 0 退出，
          # 于是每次都走 skip 分支、npm 上永远没有新版本。
          # 直接看 registry 的 HTTP 状态：200 已发布，404 未发布。
          if curl -fsS "https://registry.npmjs.org/zen-fs-config/${VERSION}" -o /dev/null; then
            echo "zen-fs-config@${VERSION} already published on npm, skipping publish step"
          else
            npm publish --access public --provenance
          fi
