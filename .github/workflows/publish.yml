name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing：npm >= 11.5 会自动向 npmjs.org 交换
      # GitHub Actions 的 OIDC token，无需 NPM_TOKEN secret。
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 自带 npm 11；保险起见仍升级到最新版
      # （trusted publishing 要求 npm >= 11.5.0）。
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "zen-fs-config@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "zen-fs-config@${VERSION} already published on npm, skipping publish step"
          else
            npm publish --access public --provenance
          fi
